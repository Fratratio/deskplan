<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-font="kai">
<head>
<meta charset="UTF-8">
<title>字体与配色样张 · 桌边 DeskPlan</title>
<link rel="stylesheet" href="../app/shared/theme-tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--ink);
    padding: 28px 32px 40px;
  }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--ink-3); margin-bottom: 22px; }
  h2 { font-size: 13px; color: var(--ink-2); margin: 26px 0 10px; font-weight: 600; }

  /* ---- 色块样张：模拟计划页卡片（左色条 + alpha 底色） ---- */
  .swatches { display: flex; flex-wrap: wrap; gap: 14px; }
  .sw {
    width: 208px; padding: 8px 10px; border-radius: 7px;
    border-left: 3px solid var(--c);
    font-size: 12.5px; line-height: 1.35;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .sw b { display: block; font-weight: 500; }
  .sw small { font-size: 10.5px; color: var(--ink-3); }
  .sw .hex { font-family: var(--font-ui); font-size: 10px; color: var(--ink-3); letter-spacing: .3px; }

  /* ---- 字体样张 ---- */
  .frow { display: flex; align-items: baseline; gap: 14px; padding: 10px 4px; border-bottom: 1px dashed var(--line); }
  .frow .tag { width: 118px; flex: none; font-size: 11.5px; color: var(--ink-3); }
  .frow .demo { font-family: var(--font-content); font-size: 21px; }
  .frow .demo small { font-size: 13px; color: var(--ink-2); }

  /* 暮色区：html 上没挂 dusk，这里手动铺一份深色令牌，好在浅色页里对照 */
  .dusk-box {
    --bg: #171A1F; --panel: #1E222A; --ink: #E6E8EC; --ink-2: #AFB5BF; --ink-3: #7C838F;
    --line: #2E3440;
    --dai: #86A8C6; --tai: #8FAD83; --ou: #C79CB8; --tong: #D0974F; --zhu: #D4775F;
    background: var(--bg); color: var(--ink);
    padding: 14px; border-radius: 10px;
  }
  .dusk-box h2 { color: var(--ink-2); }
  .dusk-box .sw { box-shadow: 0 1px 3px rgba(0,0,0,.4); }
</style>
</head>
<body>
  <h1>字体与配色样张</h1>
  <p class="sub">上：备忘卡片五色（左色条 + 30% 底色，即计划页实际渲染效果） · 下：四套中文字体实测渲染</p>

  <h2>备忘卡片五色（浅色 · 宣纸）</h2>
  <div class="swatches" id="swLight"></div>

  <div class="dusk-box">
    <h2 style="margin-top:0">备忘卡片五色（暮色）</h2>
    <div class="swatches" id="swDusk"></div>
  </div>

  <h2>四套字体</h2>
  <div id="fontRows"></div>

<script>
  const COLORS = [
    ['dai', '黛', '青黑蓝'],
    ['tai', '苔', '苍绿'],
    ['ou',  '藕', '藕荷紫'],
    ['tong','铜', '铜棕'],
    ['zhu', '朱', '朱砂'],
  ];
  function swRow(key, name, mean, a, scope) {
    a = a || 30;
    const c = getComputedStyle(scope || document.documentElement).getPropertyValue('--' + key).trim();
    return `<div class="sw" style="--c:${c};background:color-mix(in srgb, ${c} ${a}%, var(--panel))">
      <b>把备忘录开发完成</b>
      <small>09:00–11:00 · ${name}（${mean}）</small>
      <span class="hex">${c}</span>
    </div>`;
  }
  const duskBox = document.querySelector('.dusk-box');
  document.getElementById('swLight').innerHTML = COLORS.map(a => swRow(...a)).join('');
  document.getElementById('swDusk').innerHTML = COLORS.map(a => swRow(...a, 40, duskBox)).join('');

  const FONTS = [
    ['kai',  '楷体 KaiTi'],
    ['xing', '行楷 STXingkai（新）'],
    ['li',   '隶书 LiSu（备选一）'],
    ['fang', '仿宋 FangSong（备选二）'],
  ];
  document.getElementById('fontRows').innerHTML = FONTS.map(([k, label]) => `
    <div class="frow" data-font="${k}">
      <span class="tag">${label}</span>
      <span class="demo">周计划备忘录 <small>把备忘录开发完成 · 学习 · 去超市采购</small></span>
    </div>`).join('');
</script>
</body>
</html>
